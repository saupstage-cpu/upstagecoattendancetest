<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Attendance &amp; Break Log Tool</title>
<style>
  :root{
    --ink:#FFFFFF;
    --panel:#F6F6F6;
    --panel-2:#ECECEC;
    --line:#DDDDDD;
    --accent:#0A0A0A;
    --accent-dim:#ECECEC;
    --ok:#2FD97B;
    --ok-dim:#123321;
    --warn:#F5B301;
    --warn-dim:#332601;
    --danger:#FF4D4D;
    --danger-dim:#3A1414;
    --text:#0A0A0A;
    --muted:#6B6B6B;
    --radius:14px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;background:var(--ink);color:var(--text);}
  body{overscroll-behavior-y:none;}
  #app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;background:var(--ink);}
  .wide #app{max-width:1180px;}

  /* ---------- Generic ---------- */
  a{color:inherit;}
  button{font-family:inherit;}
  .btn{
    appearance:none;border:none;border-radius:12px;padding:16px 18px;font-size:16px;font-weight:700;
    cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;letter-spacing:.2px;
    transition:transform .08s ease, filter .15s ease; color:var(--text);
  }
  .btn:active{transform:scale(.97);}
  .btn-block{width:100%;}
  .btn-lg{padding:22px 18px;font-size:19px;border-radius:16px;}
  .btn-accent{background:var(--accent);color:#FFFFFF;}
  .btn-ghost{background:var(--panel-2);color:var(--text);border:1px solid var(--line);}
  .btn-ok{background:var(--ok);color:#052914;}
  .btn-warn{background:var(--warn);color:#2b2000;}
  .btn-danger{background:var(--danger);color:#2b0303;}
  .btn-outline-danger{background:transparent;border:1px solid var(--danger);color:var(--danger);}
  .btn[disabled]{opacity:.35;pointer-events:none;}
  .btn-sm{padding:9px 12px;font-size:13px;border-radius:9px;}
  .row{display:flex;align-items:center;}
  .row-between{display:flex;align-items:center;justify-content:space-between;}
  .col{display:flex;flex-direction:column;}
  .gap-8{gap:8px;} .gap-12{gap:12px;} .gap-16{gap:16px;}
  .muted{color:var(--muted);}
  .small{font-size:12.5px;}
  .tiny{font-size:11px;}
  .h1{font-size:26px;font-weight:800;letter-spacing:-.3px;margin:0;}
  .h2{font-size:19px;font-weight:800;margin:0;letter-spacing:-.2px;}
  .h3{font-size:15px;font-weight:700;margin:0;color:var(--muted);}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;}
  .card-tight{padding:12px 14px;}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-size:12.5px;font-weight:700;}
  .pill-ok{background:var(--ok-dim);color:var(--ok);}
  .pill-warn{background:var(--warn-dim);color:var(--warn);}
  .pill-danger{background:var(--danger-dim);color:var(--danger);}
  .pill-muted{background:var(--panel-2);color:var(--muted);}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;}
  .dot-ok{background:var(--ok);} .dot-warn{background:var(--warn);} .dot-danger{background:var(--danger);} .dot-muted{background:var(--muted);}
  input,select,textarea{
    background:var(--panel-2);border:1px solid var(--line);color:var(--text);border-radius:10px;
    padding:13px 14px;font-size:15.5px;width:100%;font-family:inherit;
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;}
  label{font-size:12.5px;color:var(--muted);font-weight:700;margin-bottom:6px;display:block;text-transform:none;}
  .field{margin-bottom:14px;}
  .divider{height:1px;background:var(--line);margin:14px 0;}
  .scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;}
  .backbtn{background:none;border:none;color:var(--text);font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px;padding:4px;}
  .content{padding:16px 18px 100px;flex:1;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;color:var(--muted);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;padding:8px 10px;border-bottom:1px solid var(--line);}
  td{padding:10px;border-bottom:1px solid var(--line);}
  tr:last-child td{border-bottom:none;}
  .avatar{width:38px;height:38px;border-radius:50%;background:var(--panel-2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;border:1px solid var(--line);flex-shrink:0;}
  .toast{position:fixed;bottom:110px;left:50%;transform:translateX(-50%);background:var(--panel-2);
    border:1px solid var(--line);padding:12px 18px;border-radius:12px;font-size:14px;font-weight:600;z-index:200;
    box-shadow:0 10px 30px rgba(0,0,0,.15); max-width:90%; text-align:center;}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:flex;align-items:flex-end;justify-content:center;}
  .wide .modal-bg{align-items:center;}
  .modal{background:var(--ink);width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:20px;max-height:92vh;overflow-y:auto;border:1px solid var(--line);border-bottom:none;}
  .wide .modal{border-radius:16px;border-bottom:1px solid var(--line);}
  .bottomnav{position:sticky;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);
    display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom));}
  .navbtn{flex:1;background:none;border:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px;font-size:10.5px;font-weight:700;}
  .navbtn.active{color:var(--accent);}
  .navico{font-size:19px;}
  .empty{text-align:center;padding:40px 20px;color:var(--muted);}
  .photo-thumb{width:56px;height:56px;border-radius:10px;object-fit:cover;background:var(--panel-2);border:1px solid var(--line);}
  video,canvas{width:100%;border-radius:14px;background:#000;}
  .flowbig{font-size:44px;font-weight:800;letter-spacing:-1px;}
  ::-webkit-scrollbar{display:none;}
  .link{color:var(--accent);font-weight:700;text-decoration:none;cursor:pointer;}
  .badge-req{color:var(--accent);font-weight:800;}
  .sidebar{display:none;}
  .wide .layout{display:flex;}
  .wide .sidebar{display:flex;flex-direction:column;width:220px;flex-shrink:0;border-right:1px solid var(--line);padding:20px 12px;gap:4px;min-height:100vh;}
  .wide .main{flex:1;min-width:0;}
  .wide .bottomnav{display:none;}
  .sidebtn{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;background:none;border:none;color:var(--muted);font-weight:700;font-size:14px;text-align:left;width:100%;}
  .sidebtn.active{background:var(--accent-dim);color:var(--accent);}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;flex:1;min-width:110px;}
  .kpi .num{font-size:24px;font-weight:800;}
  .kpi .lab{font-size:11.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.3px;}
  .flexwrap{display:flex;flex-wrap:wrap;gap:10px;}
</style>
</head>

function uid(prefix){ return prefix + "_" + Math.random().toString(36).slice(2,9); }
function nowISO(){ return new Date().toISOString(); }
function fmtTime(iso){ if(!iso) return "—"; return new Date(iso).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}); }
function fmtDate(iso){ return new Date(iso).toLocaleDateString([], {weekday:'short',day:'numeric',month:'short'}); }
function fmtDateShort(iso){ return new Date(iso).toLocaleDateString([], {day:'2-digit',month:'2-digit',year:'2-digit'}); }
function mins(ms){ return Math.round(ms/60000); }
function hm(totalMins){
  totalMins = Math.max(0, Math.round(totalMins));
  const h = Math.floor(totalMins/60), m = totalMins%60;
  return (h>0? h+"h ":"") + m+"m";
}
function startOfWeek(d=new Date()){
  const dt = new Date(d); const day = (dt.getDay()+6)%7; // Monday start
  dt.setHours(0,0,0,0); dt.setDate(dt.getDate()-day); return dt;
}
function sameDay(a,b){ const x=new Date(a),y=new Date(b); return x.toDateString()===y.toDateString(); }
function initials(name){ return name.split(" ").map(s=>s[0]).slice(0,2).join("").toUpperCase(); }
function escapeHtml(s){ return (s||"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

  "Admin":       ["admin-dashboard","admin-employees","admin-jobs","admin-live","admin-timesheets","admin-reports","admin-payroll","admin-notifications","admin-audit","admin-xero","admin-settings"],
  "Manager":     ["admin-dashboard","admin-employees","admin-jobs","admin-live","admin-timesheets","admin-reports","admin-notifications"],
  "Payroll":     ["admin-dashboard","admin-reports","admin-payroll","admin-notifications"],
};
function canAccess(tab){
  const role = DB.session?.role;
  if(!isAdminRole(role)) return false;
  return (ROLE_TAB_ACCESS[role]||[]).includes(tab);
}
function firstAllowedTab(role){ return (ROLE_TAB_ACCESS[role]||["admin-dashboard"])[0]; }
function audit(actor, action, target, detail){
  DB.auditLogs.unshift({id:uid("aud"), actor, action, target, detail, ts:nowISO()});
  save();
}

/* ---------------- Router / State ---------------- */
let route = {name:"login"};
let toastTimer = null;
function toast(msg){
  const el = document.createElement("div");
  el.className="toast"; el.textContent=msg;
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  setTimeout(()=>el.remove(), 2600);
}
function go(name, params={}){ route = {name, ...params}; render(); window.scrollTo(0,0); }

function currentEmployee(){ return DB.employees.find(e=>e.id===DB.session?.employeeId); }
function isWide(){ return document.body.classList.contains("wide"); }

/* ---------------- Derived helpers ---------------- */
function empOpenAttendance(empId){
  return DB.attendance.find(a=>a.employeeId===empId && !a.timeOut);
}
function empOpenBreak(attId){
  return DB.breaks.find(b=>b.attendanceId===attId && !b.end);
}
function empStatus(empId){
  const att = empOpenAttendance(empId);
  if(!att) return "off";
  if(empOpenBreak(att.id)) return "break";
  return "working";
}
function jobName(id){ const j=DB.jobs.find(j=>j.id===id); return j? j.name : "—"; }
function empName(id){ const e=DB.employees.find(e=>e.id===id); return e? e.name : "—"; }
function empRecordsForWeek(empId, weekStart){
  const end = new Date(weekStart); end.setDate(end.getDate()+7);
  return DB.attendance.filter(a=>a.employeeId===empId && new Date(a.timeIn)>=weekStart && new Date(a.timeIn)<end);
}
function weeklyNetMinutes(empId, weekStart){
  return empRecordsForWeek(empId, weekStart).reduce((s,a)=> s + (a.netMin || (a.timeOut? mins(new Date(a.timeOut)-new Date(a.timeIn)) - (a.unpaidBreakMin||0) : 0)),0);
}
function todayNetMinutes(empId){
  const att = DB.attendance.filter(a=>a.employeeId===empId && sameDay(a.timeIn, new Date()));
  return att.reduce((s,a)=>{
    if(a.netMin!=null) return s+a.netMin;
    if(!a.timeOut) return s; // still open, don't count yet in "today" total until timeout (live timer handles current one)
    return s;
  },0);
}

/* ---------------- Geolocation & reverse geocode ---------------- */
function getPosition(){
  return new Promise((resolve)=>{
    if(!navigator.geolocation){ resolve(null); return; }
    navigator.geolocation.getCurrentPosition(
      pos=> resolve({lat:pos.coords.latitude, lng:pos.coords.longitude, accuracy:pos.coords.accuracy}),
      err=> resolve(null),
      {enableHighAccuracy:true, timeout:8000}
    );
  });
}
async function reverseGeocode(lat,lng){
  try{
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=16`, {headers:{"Accept":"application/json"}});
    const j = await r.json();
    return j.display_name || `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
  }catch(e){
    return `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
  }
}
function distMeters(lat1,lng1,lat2,lng2){
  const R=6371000, toRad=d=>d*Math.PI/180;
  const dLat=toRad(lat2-lat1), dLng=toRad(lng2-lng1);
  const a=Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function geofenceCheck(lat,lng){
  for(const g of DB.settings.geofences){
    if(distMeters(lat,lng,g.lat,g.lng) <= g.radiusM) return {inside:true, name:g.name};
  }
  return {inside:false, name:null};
}

/* ---------------- Camera capture modal ---------------- */
function openCamera(onCapture, title){
  const wrap = document.createElement("div");
  wrap.className = "modal-bg";
  wrap.innerHTML = `
    <div class="modal">
      <div class="row-between" style="margin-bottom:12px;">
        <div class="h2">${title||"Take Photo"}</div>
        <button class="btn btn-ghost btn-sm" id="camClose">Cancel</button>
      </div>
      <video id="camVideo" autoplay playsinline muted></video>
      <canvas id="camCanvas" style="display:none;"></canvas>
      <div class="col gap-8" style="margin-top:14px;">
        <button class="btn btn-accent btn-block btn-lg" id="camShoot">📷 Capture Photo</button>
        <div class="tiny muted" style="text-align:center;">Live camera only — gallery uploads are disabled by admin policy.</div>
      </div>
    </div>`;
  document.body.appendChild(wrap);
  const video = wrap.querySelector("#camVideo");
  let stream = null;
  navigator.mediaDevices?.getUserMedia({video:{facingMode:"user"}, audio:false})
    .then(s=>{ stream=s; video.srcObject=s; })
    .catch(()=>{ video.replaceWith(Object.assign(document.createElement("div"), {className:"empty", innerHTML:"Camera unavailable in this browser/context.<br><br><button class='btn btn-ghost' id='camFallback'>Use placeholder photo</button>"})); 
      wrap.querySelector("#camFallback")?.addEventListener("click", ()=>{ finish("PHOTO_PLACEHOLDER"); });
    });
  function finish(dataUrl){
    stream?.getTracks().forEach(t=>t.stop());
    wrap.remove();
    onCapture(dataUrl);
  }
  wrap.querySelector("#camClose").addEventListener("click", ()=>{ stream?.getTracks().forEach(t=>t.stop()); wrap.remove(); });
  wrap.querySelector("#camShoot").addEventListener("click", ()=>{
    const canvas = wrap.querySelector("#camCanvas");
    canvas.width = video.videoWidth||320; canvas.height = video.videoHeight||240;
    canvas.getContext("2d").drawImage(video,0,0,canvas.width,canvas.height);
    const dataUrl = canvas.toDataURL("image/jpeg",0.7);
    finish(dataUrl);
  });
}

function render(){
  const app = document.getElementById("app");
  document.body.classList.toggle("wide", window.innerWidth>900 && isAdminRole(DB.session?.role));
  if(!DB.session){ app.innerHTML = screenLogin(); bindLogin(); return; }
  if(!isAdminRole(DB.session.role)){
    app.innerHTML = renderEmployeeShell();
    bindEmployeeShell();
  } else {
    app.innerHTML = renderAdminShell();
    bindAdminShell();
  }
}

function attStatusPill(status){
  return ({
    open: '<span class="pill pill-muted">Open shift</span>',
    draft: '<span class="pill pill-muted">Draft</span>',
    submitted: '<span class="pill pill-warn">Submitted</span>',
    approved: '<span class="pill pill-ok">Approved</span>',
    rejected: '<span class="pill pill-danger">Rejected</span>',
    corrected: '<span class="pill pill-warn">Corrected</span>',
  })[status] || `<span class="pill pill-muted">${status}</span>`;
}
function statusPill(st){
  if(st==="working") return `<span class="pill pill-ok"><span class="dot dot-ok"></span> Working</span>`;
  if(st==="break") return `<span class="pill pill-warn"><span class="dot dot-warn"></span> On Break</span>`;
  return `<span class="pill pill-muted"><span class="dot dot-muted"></span> Not Working</span>`;
}

function screenEmpHome(){

  const st = empStatus(emp.id);
  const openAtt = empOpenAttendance(emp.id);
  const openBrk = openAtt ? empOpenBreak(openAtt.id) : null;
  const weekStart = startOfWeek();
  const weekMin = weeklyNetMinutes(emp.id, weekStart);
  let todayMin = todayNetMinutes(emp.id);
  if(openAtt){
    const elapsed = mins(new Date()-new Date(openAtt.timeIn));
    const breaksSoFar = DB.breaks.filter(b=>b.attendanceId===openAtt.id && b.end).reduce((s,b)=> s+ (b.paid? 0 : mins(new Date(b.end)-new Date(b.start))),0);
    todayMin += Math.max(0, elapsed - breaksSoFar - (openBrk? mins(new Date()-new Date(openBrk.start)) : 0));
  }
  const job = openAtt? DB.jobs.find(j=>j.id===openAtt.jobId) : null;
  const hour = new Date().getHours();
  const greeting = hour<12?"Good morning":hour<17?"Good afternoon":"Good evening";
  const firstName = emp.name.split(" ")[0];

  const todaysLogs = DB.worklogs.filter(w=>w.employeeId===emp.id && sameDay(w.start,new Date()));
  const recentAtt = DB.attendance.filter(a=>a.employeeId===emp.id).sort((a,b)=>new Date(b.timeIn)-new Date(a.timeIn)).slice(0,3);
  const issues = DB.attendance.filter(a=>a.employeeId===emp.id && a.status==="submitted").length;
  const rejectedCount = DB.attendance.filter(a=>a.employeeId===emp.id && a.status==="rejected").length;
  const draftCount = DB.attendance.filter(a=>a.employeeId===emp.id && a.status==="draft").length;

  return `
  <div class="topbar"><div class="h2">${greeting}, ${escapeHtml(firstName)}</div>${statusPill(st)}</div>
  <div class="content">
    <div class="card" style="margin-bottom:14px;">
      <div class="row-between">
        <div>
          <div class="muted small">Current job</div>
          <div class="h2">${job? escapeHtml(job.name) : "No job selected"}</div>
        </div>
        <div style="text-align:right;">
          <div class="muted small">Since</div>
          <div class="h2">${openAtt? fmtTime(openAtt.timeIn): "—"}</div>
        </div>
      </div>
    </div>

    <div class="grid2" style="margin-bottom:16px;">
      <div class="kpi"><div class="num">${hm(todayMin)}</div><div class="lab">Today</div></div>
      <div class="kpi"><div class="num">${hm(weekMin)}</div><div class="lab">This week</div></div>
    </div>

    <div class="col gap-12" style="margin-bottom:20px;">
      ${st==="off" ? `
        <button class="btn btn-accent btn-block btn-lg" id="btnTimeIn">🟢 TIME IN</button>
      `: st==="working" ? `
        <div class="grid2">
          <button class="btn btn-warn btn-lg" id="btnStartBreak">☕ START BREAK</button>
          <button class="btn btn-danger btn-lg" id="btnTimeOut">🔴 TIME OUT</button>
        </div>
      `: `
        <button class="btn btn-ok btn-block btn-lg" id="btnEndBreak">▶️ END BREAK</button>
        <div class="tiny muted" style="text-align:center;">On break since ${fmtTime(openBrk.start)}</div>
      `}
    </div>

    ${rejectedCount>0 ? `<div class="card card-tight" style="border-color:var(--danger);margin-bottom:12px;" >
      <div class="row gap-8"><span class="dot dot-danger"></span><div class="small"><b>${rejectedCount}</b> ${rejectedCount>1?'entries need':'entry needs'} correction — check History.</div></div>
    </div>`:""}
    ${draftCount>0 ? `<div class="card card-tight" style="border-color:var(--line);margin-bottom:12px;" >
      <div class="row-between"><div class="small"><b>${draftCount}</b> completed ${draftCount>1?'shifts':'shift'} not yet submitted.</div><a class="link small" id="goSubmit">Timesheet →</a></div>
    </div>`:""}

const TASK_CATEGORIES = ["Warehouse / Prep","Site / Bump In","Pack Down","Workshop","Office / Admin"];
function deviceLabel(){
  const ua = navigator.userAgent||"";
  let os = /iPhone|iPad|iPod/.test(ua)?"iOS":/Android/.test(ua)?"Android":/Mac OS/.test(ua)?"Mac":/Windows/.test(ua)?"Windows":"Unknown device";
  return os + " · " + (navigator.platform||"web browser");
}
function doTimeIn(jobId){
  const wrap = document.createElement("div"); wrap.className="modal-bg";
  wrap.innerHTML = `<div class="modal">
    <div class="h2" style="margin-bottom:6px;">${escapeHtml(jobName(jobId))}</div>
    <div class="muted small" style="margin-bottom:14px;">What will you be doing?</div>
    <div class="field"><select id="taskCat">${TASK_CATEGORIES.map(c=>`<option>${c}</option>`).join("")}</select></div>
    <button class="btn btn-accent btn-block btn-lg" id="taskGo">Continue to Camera</button>
    <button class="btn btn-ghost btn-block" style="margin-top:8px;" id="taskCancel">Cancel</button>
  </div>`;
  document.body.appendChild(wrap);
  wrap.querySelector("#taskCancel").onclick=()=>wrap.remove();
  wrap.querySelector("#taskGo").onclick=()=>{
    const category = wrap.querySelector("#taskCat").value;
    wrap.remove();
    openCamera(async (photo)=>{
      toast("Getting GPS location…");
      const pos = await getPosition();
      const gps = pos ? {lat:pos.lat, lng:pos.lng, accuracy:pos.accuracy} : {lat:0,lng:0,accuracy:null};
      const address = pos? await reverseGeocode(pos.lat,pos.lng) : "Location unavailable";
      const fence = pos? geofenceCheck(pos.lat,pos.lng) : {inside:false,name:null};
      const emp = currentEmployee();
      const att = {
        id:uid("att"), employeeId:emp.id, jobId, category, timeIn:nowISO(), timeOut:null,
        photoIn:photo, photoOut:null, gpsIn:{...gps,address}, gpsOut:null, device:deviceLabel(),
        geofence: fence.inside? "inside":"outside", geofenceName: fence.name,
        breakIds:[], grossMin:null, unpaidBreakMin:0, paidBreakMin:0, netMin:null,
        status:"open", source:navigator.onLine?"app":"app-offline-pending", summary:""
      };
      DB.attendance.push(att); audit(emp.name,"Clock In",jobName(jobId),`${category} · Location: ${address}`); save();
      go("emp-home");
      setTimeout(()=> showConfirmModal("CLOCK IN RECORDED", [
        ["Time", fmtTime(att.timeIn)],
        ["Job", jobName(jobId)],
        ["Task", category],
        ["Location", address],
        ["GPS accuracy", gps.accuracy? Math.round(gps.accuracy)+"m" : "—"],
        ["Geofence", fence.inside? `🟢 Inside ${fence.name}` : "🟠 Outside approved location"]
      ]), 50);
    }, "Time In — Take Selfie");
  };
}
function doStartBreak(){
  const emp = currentEmployee(); const att = empOpenAttendance(emp.id);
  const rules = DB.settings.breakRules;
  const optionsHtml = rules.map(r=>`<option value="${r.id}">${escapeHtml(r.name)} (${r.minutes} min, ${r.paid?'paid':'unpaid'})</option>`).join("");
  const wrap = document.createElement("div"); wrap.className="modal-bg";
  wrap.innerHTML = `<div class="modal">
    <div class="h2" style="margin-bottom:14px;">Start Break</div>
    <div class="field"><label>Break type</label><select id="brkType">${optionsHtml}</select></div>
    <button class="btn btn-warn btn-block btn-lg" id="brkGo">Start Break</button>
    <button class="btn btn-ghost btn-block" style="margin-top:8px;" id="brkCancel">Cancel</button>
  </div>`;
  document.body.appendChild(wrap);
  wrap.querySelector("#brkCancel").onclick=()=>wrap.remove();
  wrap.querySelector("#brkGo").onclick= async ()=>{
    const ruleId = wrap.querySelector("#brkType").value;
    const rule = rules.find(r=>r.id===ruleId);
    wrap.remove();
    toast("Getting GPS location…");
    const pos = await getPosition();
    const brk = {id:uid("brk"), attendanceId:att.id, type:rule.name, start:nowISO(), end:null, paid:rule.paid, plannedMinutes:rule.minutes, gpsStart:pos||{lat:0,lng:0}, gpsEnd:null};
    DB.breaks.push(brk); att.breakIds.push(brk.id);
    audit(emp.name,"Start Break",jobName(att.jobId),rule.name); save();
    go("emp-home"); toast(`${rule.name} started`);
  };
}
function doEndBreak(){
  const emp = currentEmployee(); const att = empOpenAttendance(emp.id); const brk = empOpenBreak(att.id);
  (async ()=>{
    toast("Getting GPS location…");
    const pos = await getPosition();
    brk.end = nowISO(); brk.gpsEnd = pos||{lat:0,lng:0};
    audit(emp.name,"End Break",jobName(att.jobId), `${brk.type} — ${hm(mins(new Date(brk.end)-new Date(brk.start)))}`); save();
    go("emp-home"); toast(`Break ended — ${hm(mins(new Date(brk.end)-new Date(brk.start)))}`);
  })();
}
function doTimeOut(){
  const emp = currentEmployee(); const att = empOpenAttendance(emp.id);
  const openBrk = empOpenBreak(att.id);
  if(openBrk){ toast("End your current break before timing out."); return; }
  openCamera(async (photo)=>{
    toast("Getting GPS location…");
    const pos = await getPosition();
    const gps = pos ? {lat:pos.lat, lng:pos.lng, accuracy:pos.accuracy} : {lat:0,lng:0,accuracy:null};
    const address = pos? await reverseGeocode(pos.lat,pos.lng) : "Location unavailable";
    showWorkSummaryModal((summary)=>{
      att.timeOut = nowISO(); att.photoOut = photo; att.gpsOut = {...gps,address};
      att.grossMin = mins(new Date(att.timeOut)-new Date(att.timeIn));
      const brks = DB.breaks.filter(b=>att.breakIds.includes(b.id));
      att.unpaidBreakMin = brks.filter(b=>!b.paid).reduce((s,b)=>s+mins(new Date(b.end)-new Date(b.start)),0);
      att.paidBreakMin = brks.filter(b=>b.paid).reduce((s,b)=>s+mins(new Date(b.end)-new Date(b.start)),0);
      att.netMin = att.grossMin - att.unpaidBreakMin;
      att.summary = summary; att.status="draft";
      audit(emp.name,"Clock Out",jobName(att.jobId), `Net: ${hm(att.netMin)}`);
      save(); go("emp-home");
      setTimeout(()=> showConfirmModal("CLOCK OUT RECORDED", [
        ["Worked today", hm(att.netMin)],
        ["Break", hm(att.unpaidBreakMin+att.paidBreakMin)],
        ["Job", jobName(att.jobId)],
        ["Location", address],
        ["GPS accuracy", gps.accuracy? Math.round(gps.accuracy)+"m" : "—"]
      ]), 50);
    });
  }, "Time Out — Take Selfie");
}

function screenTimesheet(){
  const emp = currentEmployee();
  const weekStart = startOfWeek();
  const week = empRecordsForWeek(emp.id, weekStart).filter(a=>a.timeOut);
  const totalNet = week.reduce((s,a)=>s+(a.netMin||0),0);
  const draftCount = week.filter(a=>a.status==="draft").length;
  const allApproved = week.length>0 && week.every(a=>a.status==="approved");
  const anySubmitted = week.some(a=>a.status==="submitted");
  const anyRejected = week.some(a=>a.status==="rejected");
  let bannerStatus = '<span class="pill pill-muted">In progress</span>';
  if(allApproved) bannerStatus = '<span class="pill pill-ok">All approved</span>';
  else if(anyRejected) bannerStatus = '<span class="pill pill-danger">Needs correction — rejected</span>';
  else if(anySubmitted) bannerStatus = '<span class="pill pill-warn">Submitted — awaiting approval</span>';
  else if(draftCount>0) bannerStatus = '<span class="pill pill-muted">Draft — not yet submitted</span>';
  return `
  <div class="topbar"><div class="h2">My Timesheet</div></div>
  <div class="content">
    <div class="card" style="margin-bottom:16px;">
      <div class="muted small">Week of ${fmtDateShort(weekStart)}</div>

      ${draftCount>0? `<button class="btn btn-accent btn-block" style="margin-top:14px;" id="submitTs">Submit ${draftCount} Day${draftCount>1?'s':''} for Approval</button>`:""}
    </div>

        <td>${fmtTime(a.timeIn)}</td><td>${a.timeOut?fmtTime(a.timeOut):'—'}</td>
        <td>${hm((a.unpaidBreakMin||0)+(a.paidBreakMin||0))}</td>
        <td>${a.netMin!=null?hm(a.netMin):'—'}</td>
        <td>${attStatusPill(a.status)}</td>

      ${week.length===0?`<tr><td colspan="7" class="muted" style="text-align:center;padding:20px;">No completed shifts this week yet</td></tr>`:""}
    </table>
    <div class="tiny muted" style="margin-top:14px;">Approved records are locked. If something looks wrong on an approved or submitted day, open it and tap "Request Correction".</div>
  </div>`;
}

function bindScreen(){
  const $ = id=>document.getElementById(id);
  if($("back")) $("back").onclick = ()=> {
    if(route.name==="privacy") go("profile");
    else if(route.name==="emp-att-detail") go("history");
    else go("emp-home");
  };
  document.querySelectorAll("[data-emp-att]").forEach(el=> el.onclick = ()=> go("emp-att-detail",{id:el.dataset.empAtt}));
  if($("reqCorrection")) $("reqCorrection").onclick = ()=> modalRequestCorrection(route.id);
  if($("submitTs")) $("submitTs").onclick = ()=>{
    const emp = currentEmployee();
    const week = empRecordsForWeek(emp.id, startOfWeek()).filter(a=>a.status==="draft");
    week.forEach(a=> a.status="submitted");
    audit(emp.name,"Submitted timesheet for approval","Weekly timesheet",`${week.length} day(s)`);
    save(); toast("Timesheet submitted for approval"); go("timesheet");
  };
  if($("btnTimeIn")) $("btnTimeIn").onclick = ()=> go("job-select");
  document.querySelectorAll("[data-job]").forEach(b=> b.onclick = ()=> doTimeIn(b.dataset.job));
  if($("btnStartBreak")) $("btnStartBreak").onclick = doStartBreak;
  if($("btnEndBreak")) $("btnEndBreak").onclick = doEndBreak;
  if($("btnTimeOut")) $("btnTimeOut").onclick = doTimeOut;
  if($("goWorklog")) $("goWorklog").onclick = ()=> go("worklog-add");
  if($("goHistory")) $("goHistory").onclick = ()=> go("history");
  if($("goSubmit")) $("goSubmit").onclick = ()=> go("timesheet");
  if($("addWl")) $("addWl").onclick = ()=> go("worklog-add");
  if($("viewPrivacy")) $("viewPrivacy").onclick = ()=> { PRIVACY_FROM_LOGIN=false; go("privacy"); };
  if($("logoutBtn")) $("logoutBtn").onclick = ()=> { audit(currentEmployee().name,"Logged out","Employee session",""); DB.session=null; save(); go("login"); };
  if($("ackBtn")) $("ackBtn").onclick = ()=> { toast("Acknowledged"); go(PRIVACY_FROM_LOGIN? "login" : "profile"); PRIVACY_FROM_LOGIN=false; };

  if($("wlPhotoBtn")){
    let photoTaken = false;
    $("wlPhotoBtn").onclick = ()=> openCamera((photo)=>{
      photoTaken = true;
      $("wlPhotoPreview").innerHTML = `<img src="${photo}" class="photo-thumb">`;
    }, "Job Photo");
  }
  if($("wlTaskPreset")) $("wlTaskPreset").onchange = ()=>{ if($("wlTaskPreset").value) $("wlTask").value = $("wlTaskPreset").value; };
  if($("wlSave")) $("wlSave").onclick = ()=>{
    const emp = currentEmployee();
    const jobId = $("wlJob").value, task = $("wlTask").value || $("wlTaskPreset").value;
    if(!task){ toast("Add a task description"); return; }
    const today = new Date();
    const [sh,sm] = ($("wlStart").value||"08:00").split(":").map(Number);
    const [fh,fm] = ($("wlFinish").value||"").split(":").map(Number);
    const start = new Date(today); start.setHours(sh,sm,0,0);
    const finish = $("wlFinish").value ? (()=>{const d=new Date(today); d.setHours(fh,fm,0,0); return d;})() : null;
    DB.worklogs.push({id:uid("wl"), attendanceId:null, employeeId:emp.id, jobId, task, start:start.toISOString(), finish: finish?finish.toISOString():null, notes:$("wlNotes").value, photos: $("wlPhotoPreview").innerHTML? 1:0});
    audit(emp.name,"Added work log entry",jobName(jobId),task);
    save(); toast("Work entry saved"); go("worklog");
  };

  if(document.getElementById("att")) {} // reserved
}

  const emps = DB.employees.filter(e=>e.status==="active" && e.permission==="Employee");
  let working=0, onBreak=0, notClocked=0, clockedOut=0, late=0, totalMin=0;
  emps.forEach(e=>{
    const st = empStatus(e.id);
    const todays = DB.attendance.filter(a=>a.employeeId===e.id && sameDay(a.timeIn,new Date()));
    if(st==="working") working++;
    else if(st==="break") onBreak++;
    else if(todays.some(a=>a.timeOut)) clockedOut++;
    else notClocked++;
    todays.forEach(a=>{
      const t = new Date(a.timeIn);
      if(t.getHours()>8 || (t.getHours()===8 && t.getMinutes()>DB.settings.lateThresholdMin)) late++;
      if(a.netMin) totalMin += a.netMin;
      else if(!a.timeOut) totalMin += mins(new Date()-new Date(a.timeIn));
    });
  });
  const missingOut = DB.attendance.filter(a=> !a.timeOut && !sameDay(a.timeIn,new Date())).length;
  return {working,onBreak,notClocked,clockedOut,late,missingOut,totalHeadcount:emps.length,totalMin};
}
function activeJobsToday(){
  return DB.jobs.filter(j=>j.status==="Active").map(j=>{
    const todays = DB.attendance.filter(a=>a.jobId===j.id && sameDay(a.timeIn,new Date()));
    const people = new Set(todays.map(a=>a.employeeId)).size;
    const hrs = todays.reduce((s,a)=> s + (a.netMin!=null? a.netMin : (!a.timeOut? mins(new Date()-new Date(a.timeIn)) : 0)), 0);
    return {job:j, people, hrs};
  }).filter(x=>x.people>0);
}

function payrollRows(fromDate, toDate){
  const from = fromDate? new Date(fromDate) : startOfWeek();
  const to = toDate? new Date(toDate+"T23:59:59") : new Date();
  const emps = DB.employees.filter(e=>e.permission==="Employee"||e.permission==="Manager");
  const otThreshold = DB.settings.overtimeThresholdHrs*60;
  return emps.map(e=>{
    const recs = DB.attendance.filter(a=>a.employeeId===e.id && (a.status==="approved"||a.status==="corrected") && new Date(a.timeIn)>=from && new Date(a.timeIn)<=to);
    let regular=0, ot=0;
    recs.forEach(a=>{
      const g = a.grossMin||0;
      if(g>otThreshold){ regular += otThreshold; ot += g-otThreshold; }
      else regular += g;
    });
    // convert gross-based regular/ot roughly to net-adjusted using unpaid break ratio
    const totalNet = recs.reduce((s,a)=>s+(a.netMin||0),0);
    const totalGross = recs.reduce((s,a)=>s+(a.grossMin||0),0) || 1;
    const scale = totalGross? totalNet/totalGross : 1;
    return {emp:e, regular: regular*scale/60, ot: ot*scale/60, total: totalNet/60, shifts: recs.length};
  }).filter(r=>r.shifts>0);
}

function buildNotifications(){
  const list = [];
  const s = DB.settings.notifications;
  const otThreshold = DB.settings.overtimeThresholdHrs*60;
  DB.attendance.forEach(a=>{
    const emp = DB.employees.find(e=>e.id===a.employeeId); if(!emp || emp.permission!=="Employee" && emp.permission!=="Manager") return;
    if(s.forgotTimeOut && !a.timeOut && !sameDay(a.timeIn,new Date())){
      list.push({icon:"⚠️", color:"var(--danger)", title:"Missing Clock Out", detail:`${emp.name} has not clocked out. Last recorded: ${fmtTime(a.timeIn)} on ${fmtDate(a.timeIn)}.`, time:fmtDateShort(a.timeIn)});
    }
    if(a.grossMin && a.grossMin>otThreshold){
      list.push({icon:"⏱", color:"var(--warn)", title:"Overtime", detail:`${emp.name} worked ${hm(a.grossMin)} on ${fmtDate(a.timeIn)} — ${hm(a.grossMin-otThreshold)} over threshold.`, time:fmtDateShort(a.timeIn)});
    }
    if(sameDay(a.timeIn,new Date())){
      const t = new Date(a.timeIn);
      if(t.getHours()>8 || (t.getHours()===8 && t.getMinutes()>DB.settings.lateThresholdMin)){
        list.push({icon:"🔴", color:"var(--danger)", title:"Late Arrival", detail:`${emp.name} clocked in at ${fmtTime(a.timeIn)} today.`, time:"Today"});
      }
    }
    if(s.timesheetApproved && a.status==="submitted"){
      list.push({icon:"🔔", color:"var(--warn)", title:"Timesheet Awaiting Approval", detail:`${emp.name}'s shift on ${fmtDate(a.timeIn)} is submitted and awaiting your review.`, time:fmtDateShort(a.timeIn)});
    }
    if(s.timesheetRejected && a.status==="rejected"){
      list.push({icon:"✖", color:"var(--danger)", title:"Timesheet Rejected", detail:`${emp.name}'s shift on ${fmtDate(a.timeIn)} was rejected: ${a.rejectReason||''}`, time:fmtDateShort(a.timeIn)});
    }
  });
  if(s.xeroSyncFailure && !DB.settings.xero.connected){
    // informational only, not a failure — omit unless actually attempted
  }
  return list.sort((a,b)=> (a.title<b.title?1:-1));
}

      <div class="field"><label>Date</label><input type="date" id="meDate" value="${new Date().toISOString().slice(0,10)}"></div>
      <div class="field"></div>
    </div>
    <div class="grid2">
      <div class="field"><label>Time In</label><input type="time" id="meIn" value="08:00"></div>
      <div class="field"><label>Time Out</label><input type="time" id="meOut" value="16:30"></div>
    </div>
    <div class="field"><label>Reason (required — will be recorded in audit log)</label><textarea id="meReason" rows="2" placeholder="e.g. Phone died on site, entered manually from supervisor confirmation"></textarea></div>
    <button class="btn btn-accent btn-block btn-lg" id="meSave">Save Manual Entry</button>
    <button class="btn btn-ghost btn-block" style="margin-top:8px;" id="meCancel">Cancel</button>
  </div>`;
  document.body.appendChild(wrap);
  wrap.querySelector("#meCancel").onclick=()=>wrap.remove();
  wrap.querySelector("#meSave").onclick=()=>{
    const reason = wrap.querySelector("#meReason").value;
    if(!reason){ toast("Reason is required"); return; }
    const date = wrap.querySelector("#meDate").value;
    const [ih,im] = wrap.querySelector("#meIn").value.split(":").map(Number);
    const [oh,om] = wrap.querySelector("#meOut").value.split(":").map(Number);
    const ti = new Date(date); ti.setHours(ih,im,0,0);
    const to = new Date(date); to.setHours(oh,om,0,0);
    const gross = mins(to-ti);
    DB.attendance.push({id:uid("att"), employeeId:empId, jobId:wrap.querySelector("#meJob").value, timeIn:ti.toISOString(), timeOut:to.toISOString(),
      photoIn:null, photoOut:null, gpsIn:{lat:0,lng:0,address:"Manual entry — no GPS captured"}, gpsOut:null, geofence:"n/a",
      breakIds:[], grossMin:gross, unpaidBreakMin:0, paidBreakMin:0, netMin:gross, status:"submitted", source:"admin-manual", summary:reason});
    audit(DB.session.name,"Added manual attendance entry", e.name, `${date} ${wrap.querySelector("#meIn").value}-${wrap.querySelector("#meOut").value}. Reason: ${reason}`);
    save(); wrap.remove(); toast("Manual entry saved — pending approval"); go("admin-employee-detail",{id:empId});
  };
}

function baseFilteredAttendance(){
  const $ = id=>document.getElementById(id);
  const empId = $("repEmp").value, jobId = $("repJob").value, status=$("repStatus").value, dept=$("repDept").value;
  const from = $("repFrom").value ? new Date($("repFrom").value) : null;
  const to = $("repTo").value ? new Date($("repTo").value+"T23:59:59") : null;
  let rows = DB.attendance.filter(a=> DB.employees.find(e=>e.id===a.employeeId)?.permission==="Employee" || DB.employees.find(e=>e.id===a.employeeId)?.permission==="Manager");
  if(empId) rows = rows.filter(a=>a.employeeId===empId);
  if(jobId) rows = rows.filter(a=>a.jobId===jobId);
  if(status) rows = rows.filter(a=>a.status===status);
  if(dept) rows = rows.filter(a=> DB.employees.find(e=>e.id===a.employeeId)?.department===dept);
  if(from) rows = rows.filter(a=>new Date(a.timeIn)>=from);
  if(to) rows = rows.filter(a=>new Date(a.timeIn)<=to);
  rows.sort((a,b)=>new Date(b.timeIn)-new Date(a.timeIn));
  return rows;
}
function runReport(){
  const type = document.getElementById("repType").value;
  const rows = baseFilteredAttendance();
  const el = document.getElementById("reportResults");
  const overtimeThreshold = DB.settings.overtimeThresholdHrs*60;

  let header, tableRows, csvRows, title;

  if(type==="attendance"){
    title = `${rows.length} RECORDS · ${hm(rows.reduce((s,a)=>s+(a.netMin||0),0))} TOTAL`;
    header = ["Date","Employee","Job","In","Out","Net","Status"];
    tableRows = rows.map(a=>[fmtDateShort(a.timeIn), empName(a.employeeId), jobName(a.jobId), fmtTime(a.timeIn), a.timeOut?fmtTime(a.timeOut):'—', a.netMin!=null?hm(a.netMin):'—', a.status]);
  } else if(type==="job-labour"){
    const byJob = {};
    rows.forEach(a=>{ const k=a.jobId; byJob[k]=byJob[k]||{}; byJob[k][a.employeeId]=(byJob[k][a.employeeId]||0)+(a.netMin||0); });
    const flat = [];
    Object.entries(byJob).forEach(([jobId,emps])=> Object.entries(emps).forEach(([empId,mins])=> flat.push({jobId,empId,mins})));
    flat.sort((a,b)=> jobName(a.jobId).localeCompare(jobName(b.jobId)));
    const rate = id => DB.employees.find(e=>e.id===id)?.hourlyRate || 0;
    title = `${flat.length} JOB/EMPLOYEE LINES · ${hm(flat.reduce((s,f)=>s+f.mins,0))} TOTAL`;
    header = ["Job","Employee","Hours","Labour Cost"];
    tableRows = flat.map(f=>[jobName(f.jobId), empName(f.empId), hm(f.mins), "$"+((f.mins/60)*rate(f.empId)).toFixed(2)]);
  } else if(type==="department"){
    const byDept = {};
    rows.forEach(a=>{ const d = DB.employees.find(e=>e.id===a.employeeId)?.department||"—"; byDept[d]=(byDept[d]||0)+(a.netMin||0); });
    title = `${Object.keys(byDept).length} DEPARTMENTS`;
    header = ["Department","Total Hours"];
    tableRows = Object.entries(byDept).map(([d,m])=>[d, hm(m)]);
  } else if(type==="late"){
    const late = rows.filter(a=>{ const t=new Date(a.timeIn); return t.getHours()>8 || (t.getHours()===8 && t.getMinutes()>DB.settings.lateThresholdMin); });
    title = `${late.length} LATE ARRIVALS`;
    header = ["Date","Employee","Job","Clock In","Minutes Late"];
    tableRows = late.map(a=>{ const t=new Date(a.timeIn); const lateMin = Math.max(0,(t.getHours()-8)*60+t.getMinutes()); return [fmtDateShort(a.timeIn), empName(a.employeeId), jobName(a.jobId), fmtTime(a.timeIn), lateMin+" min"]; });
  } else if(type==="missing"){
    const missing = rows.filter(a=>!a.timeOut && !sameDay(a.timeIn,new Date()));
    title = `${missing.length} MISSING CLOCK-OUTS`;
    header = ["Date","Employee","Job","Clock In"];
    tableRows = missing.map(a=>[fmtDateShort(a.timeIn), empName(a.employeeId), jobName(a.jobId), fmtTime(a.timeIn)]);
  } else if(type==="overtime"){
    const ot = rows.filter(a=>a.grossMin && a.grossMin>overtimeThreshold);
    title = `${ot.length} OVERTIME SHIFTS · Threshold ${DB.settings.overtimeThresholdHrs}h/day`;
    header = ["Date","Employee","Job","Total Hours","Overtime"];
    tableRows = ot.map(a=>[fmtDateShort(a.timeIn), empName(a.employeeId), jobName(a.jobId), hm(a.grossMin), hm(a.grossMin-overtimeThreshold)]);
  } else if(type==="location"){
    const exceptions = rows.filter(a=>a.geofence==="outside");
    title = `${exceptions.length} LOCATION EXCEPTIONS`;
    header = ["Date","Employee","Job","Clock In","Location"];
    tableRows = exceptions.map(a=>[fmtDateShort(a.timeIn), empName(a.employeeId), jobName(a.jobId), fmtTime(a.timeIn), a.gpsIn.address||'—']);
  }

  window.__lastReportHeader = header; window.__lastReportRows = tableRows;
  el.innerHTML = `
    <div class="row-between" style="margin:16px 0 10px;"><div class="h3">${title}</div>
      <div class="row gap-8">
        <button class="btn btn-ghost btn-sm" id="expCsv">Export CSV</button>
        <button class="btn btn-ghost btn-sm" id="expPdf">Export PDF</button>
      </div>
    </div>
    <table>
      <tr>${header.map(h=>`<th>${h}</th>`).join("")}</tr>
      ${tableRows.map(r=>`<tr>${r.map(v=>`<td>${escapeHtml(String(v))}</td>`).join("")}</tr>`).join("")}
      ${tableRows.length===0? `<tr><td colspan="${header.length}" class="muted" style="text-align:center;padding:16px;">No matching records</td></tr>`:""}
    </table>`;
  document.getElementById("expCsv").onclick = exportCSV;
  document.getElementById("expPdf").onclick = ()=> toast("A production build renders this via a PDF service (e.g. server-side Puppeteer or a PDF library) — CSV export is fully functional now.");
}
function exportCSV(){
  const header = window.__lastReportHeader||[]; const rows = window.__lastReportRows||[];
  const lines = [header.join(","), ...rows.map(r=> r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(","))];
  const blob = new Blob([lines.join("\n")], {type:"text/csv"});
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a"); link.href=url; link.download="upstage_report.csv"; link.click();
  audit(DB.session.name,"Exported report","Reports",`${rows.length} rows`); save();
}
